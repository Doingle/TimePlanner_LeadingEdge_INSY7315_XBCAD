# tests and publishes the dashboard once, then deploys that package.
# Run it by hand from the Actions tab to deploy any branch to staging. A push to main deploys to the demo site.
# The Leading Edge pilot site is deployed from its own private mirror repository, never from here
name: Deploy Dashboard

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Test and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test core
        run: dotnet test TimePlanner.Core.Tests/TimePlanner.Core.Tests.csproj --configuration Release

      - name: Test api
        run: dotnet test TimePlanner.Api.Tests/TimePlanner.Api.Tests.csproj --configuration Release

      - name: Publish dashboard
        run: dotnet publish TimePlanner.Dashboard/TimePlanner.Dashboard.csproj --configuration Release --output publish/dashboard

      - name: Keep the package for the deploy jobs
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: publish/dashboard
          retention-days: 7
          if-no-files-found: error

  staging:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    uses: ./.github/workflows/deploy-site.yml
    with:
      site: Staging
      app-name: ${{ vars.STAGING_WEBAPP_NAME }}
      url: ${{ vars.STAGING_WEBAPP_URL }}
    secrets:
      publish-profile: ${{ secrets.STAGING_WEBAPP_PUBLISH_PROFILE }}

  # the demo site keeps the original variable names, so nothing already set up changes
  demo:
    if: github.event_name == 'push'
    needs: build
    uses: ./.github/workflows/deploy-site.yml
    with:
      site: Demo
      app-name: ${{ vars.AZURE_WEBAPP_NAME }}
      url: ${{ vars.AZURE_WEBAPP_URL }}
    secrets:
      publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
